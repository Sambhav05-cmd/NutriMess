# Optional persistent backend for the Netlify frontend.
# Render's Starter service and persistent disk are paid resources.
services:
  - type: web
    name: nutrimess-api
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev && npm run import:data
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.11.0
      - key: HOST
        value: 0.0.0.0
      - key: DB_PATH
        value: /opt/render/project/src/.data/nutrimess.sqlite
      - key: TRUST_PROXY
        value: "1"
      - key: PUBLIC_ORIGIN
        sync: false
    disk:
      name: nutrimess-data
      mountPath: /opt/render/project/src/.data
      sizeGB: 1
