# Hosts the frontend and API together. User data is persisted in MongoDB Atlas.
services:
  - type: web
    name: nutrimess-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev && npm run import:data
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.11.0
      - key: HOST
        value: 0.0.0.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: nutrimess
      - key: TRUST_PROXY
        value: "1"
